# Image-only compose file used on the AWS/GCP VM (image is built and pushed by CI).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    command: postgres -c shared_buffers=64MB -c max_connections=20
    environment:
      POSTGRES_DB: scriptcut
      POSTGRES_USER: scriptcut
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scriptcut -d scriptcut"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:?set APP_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://scriptcut:${POSTGRES_PASSWORD}@db:5432/scriptcut
      TRANSCRIBE_PROVIDER: ${TRANSCRIBE_PROVIDER:-stub}
    ports:
      - "80:8000"
    volumes:
      - media:/data/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  media:
