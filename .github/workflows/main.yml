name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Backend unit tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pytest tests/unit -q
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Frontend unit tests + build
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run test:unit
          npm run build

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: scriptcut
          POSTGRES_USER: scriptcut
          POSTGRES_PASSWORD: scriptcut
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scriptcut -d scriptcut"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://scriptcut:scriptcut@localhost:5432/scriptcut
      MEDIA_DIR: /tmp/media
      TRANSCRIBE_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Migrate and run integration tests
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          alembic upgrade head
          pytest tests/integration -q

  e2e-tests:
    needs: [unit-tests, integration-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install ffmpeg (fixture generation)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Start stack (app + postgres)
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Install Playwright
        working-directory: e2e
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
      - name: Run E2E suite
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8000
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Set repository variable DEPLOY_VM=true to deploy to the AWS EC2 / GCP VM
  deploy-vm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VM == 'true'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-vm
    steps:
      - uses: actions/checkout@v4
      - id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          source: docker-compose.prod.yml
          target: /tmp/scriptcut-deploy
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ steps.img.outputs.ref }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          envs: APP_IMAGE,POSTGRES_PASSWORD,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            sudo mkdir -p /opt/scriptcut
            sudo cp /tmp/scriptcut-deploy/docker-compose.prod.yml /opt/scriptcut/docker-compose.prod.yml
            cd /opt/scriptcut
            printf 'APP_IMAGE=%s\nPOSTGRES_PASSWORD=%s\n' "$APP_IMAGE" "$POSTGRES_PASSWORD" | sudo tee .env >/dev/null
            sudo chmod 600 .env
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker compose -f docker-compose.prod.yml pull app
            sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sudo docker image prune -f
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://${{ secrets.VM_HOST }}/api/health"; then exit 0; fi
            sleep 10
          done
          echo "Health check failed" && exit 1

  # Set repository variable DEPLOY_RENDER=true
  deploy-render:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_RENDER == 'true'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  # Set repository variable DEPLOY_RAILWAY=true (and RAILWAY_SERVICE)
  deploy-railway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_RAILWAY == 'true'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install -g @railway/cli
      - run: railway up --service "${{ vars.RAILWAY_SERVICE }}" --ci

  # Set repository variable DEPLOY_VERCEL=true (frontend only)
  deploy-vercel:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_VERCEL == 'true'
    needs: [build-and-push]
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npx vercel@latest deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
