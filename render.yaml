databases:
  - name: scriptcut-db
    databaseName: scriptcut
    user: scriptcut
    plan: free

services:
  - type: web
    name: scriptcut-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false   # CI triggers deploys through the deploy hook
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: scriptcut-db
          property: connectionString
      - key: MEDIA_DIR
        value: /tmp/media   # ephemeral on free plan
      - key: TRANSCRIBE_PROVIDER
        value: stub
