AWSTemplateFormatVersion: "2010-09-09"
Description: ScriptCut AI - one free-tier EC2 instance running Docker Compose, plus a budget alert

Parameters:
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t2.micro]   # free-tier-eligible types only
  SshCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Restrict to your IP/32 for manual use; CI deploys need it reachable from GitHub runners
  AlertEmail:
    Type: String
  MonthlyBudgetUsd:
    Type: Number
    Default: 10
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ScriptCut web and ssh
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 22,  ToPort: 22,  CidrIp: !Ref SshCidr }

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyName
      SecurityGroupIds: [!GetAtt SecurityGroup.GroupId]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: scriptcut-vm }]
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail
          fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
          dnf install -y docker
          systemctl enable --now docker
          mkdir -p /usr/local/lib/docker/cli-plugins /opt/scriptcut
          curl -fsSL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
          usermod -aG docker ec2-user

  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: scriptcut-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - { SubscriptionType: EMAIL, Address: !Ref AlertEmail }

Outputs:
  PublicIp:
    Value: !GetAtt Instance.PublicIp
  SshCommand:
    Value: !Sub "ssh ec2-user@${Instance.PublicIp}"
